  <circle cx="259" cy="114" r="2" fill="#265C4B"/>
  <circle cx="271" cy="114" r="2" fill="#265C4B"/>
  <path d="M261 122c2.5 2.5 7.5 2.5 10 0" stroke="#265C4B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Accent sparkles -->
  <path d="M48 140l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z" fill="#FFD25E"/>
  <path d="M318 130l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6z" fill="#49C184"/>
