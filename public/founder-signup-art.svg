  <!-- Speech bubbles -->
  <g>
    <circle cx="95" cy="48" r="22" fill="#FFD25E"/>
    <path d="M88 68 L95 80 L102 68" fill="#FFD25E"/>
    <!-- lightbulb -->
    <path d="M95 38c-5.5 0-10 4-10 9 0 3.5 2 6.5 5 8v4h10v-4c3-1.5 5-4.5 5-8 0-5-4.5-9-10-9z" stroke="#265C4B" stroke-width="2" fill="none"/>
    <path d="M90 63h10" stroke="#265C4B" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="185" cy="36" r="20" fill="#FFD25E"/>
