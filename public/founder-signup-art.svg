  <circle cx="104" cy="114" r="2" fill="#265C4B"/>
  <circle cx="116" cy="114" r="2" fill="#265C4B"/>
  <path d="M106 122c2.5 2.5 7.5 2.5 10 0" stroke="#265C4B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Person 2 (centre) -->
  <g stroke="#265C4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="185" cy="108" r="17"/>
    <path d="M185 125v20"/>
    <path d="M185 145c-20 10-32 32-32 55"/>
    <path d="M185 145c20 10 32 32 32 55"/>
    <path d="M165 162h40"/>
