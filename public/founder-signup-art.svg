  <circle cx="179" cy="104" r="2" fill="#265C4B"/>
  <circle cx="191" cy="104" r="2" fill="#265C4B"/>
  <path d="M181 113c2.5 2.5 7.5 2.5 10 0" stroke="#265C4B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- hair -->
