<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Teevo Match — B1 visual contact sheet</title>
<style>
  :root { --green:#265C4B; --cream:#FDFCF5; --line:#d7e5d9; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--cream); color:var(--green); }
  header { padding:28px 24px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:24px; }
  .meta { color:#444; font-size:14px; line-height:1.5; max-width:52rem; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; padding:20px 24px 32px; }
  figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:10px 12px 14px; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<header>
  <h1>B1 visual answers — 390px contact sheet</h1>
  <p class="meta">Rendered admin questionnaire cards. Each group includes a selected card (green border and filled radio) and the unselected alternatives. Strike is the right-handed orientation: heel on the left of the face, toe on the right.</p>
</header>
<div class="grid">
  <figure>
    <img src="trajectory-390.png" alt="Trajectory options at 390px, Mid selected" />
    <figcaption><strong>Trajectory.</strong> Mid selected. Low, High, and Not sure unselected.</figcaption>
  </figure>
  <figure>
    <img src="start-390.png" alt="Ball start options at 390px, Right selected" />
    <figcaption><strong>Ball start.</strong> Right selected. Left, Centre, Varies, and Not sure unselected.</figcaption>
  </figure>
  <figure>
    <img src="curve-390.png" alt="Ball curve options at 390px, Curves left selected" />
    <figcaption><strong>Ball curve.</strong> Curves left selected. Mostly straight, Curves right, Varies, and Not sure unselected.</figcaption>
  </figure>
  <figure>
    <img src="strike-390.png" alt="Strike face options at 390px, Heel selected" />
    <figcaption><strong>Strike face.</strong> Heel selected. Centre, Toe, High on face, Low on face, Varies a lot, and Not sure unselected.</figcaption>
  </figure>
</div>
</body>
</html>
