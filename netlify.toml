[build]
  command = "npm run build"

# Optional: increase Node HTTP header size if you hit header-related limits.
# Request body size for serverless is fixed at ~6MB on Netlify; use smaller images or direct-to-Storage uploads for larger files.
# [build.environment]
#   NODE_OPTIONS = "--max-http-headers-size=16384"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Run expire-offers cron every hour (UTC). Uses Supabase env vars (same as the app).
[functions."expire-offers-cron"]
  schedule = "@hourly"

# Admin notification SLAs (seller not dispatched, delivery overdue, buyer not confirmed, stuck).
[functions."notification-ops-cron"]
  schedule = "@hourly"

# Watchlist still-available reminders (default 3 days after watch / now-available).
[functions."watchlist-reminders-cron"]
  schedule = "@daily"

# Admin new-users digest: 17:00 and 18:00 UTC; API gates on Europe/London 18:00 (DST-safe).
[functions."admin-new-users-digest-cron"]
  schedule = "0 17,18 * * *"

# Weekly Creator Roundup: Mon 08:00 and 09:00 UTC; API gates on Europe/London Monday 09:00.
[functions."creator-weekly-roundup-cron"]
  schedule = "0 8,9 * * 1"
